name: Update and Publish mscoreutils 

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
	  Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
          Install-Module powershell-yaml -Force -Scope CurrentUser

      - name: Run update script
        id: update
        shell: pwsh
        run: |
          ./update.ps1

      - name: Pack Chocolatey package
        if: steps.update.outputs.updated == 'true'
        shell: pwsh
        run: |
          choco pack .\mscoreutils.nuspec

      - name: Push to Chocolatey
        if: steps.update.outputs.updated == 'true'
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          choco push --api-key $env:CHOCO_API_KEY --source https://push.chocolatey.org/

      - name: Commit tracking changes back to my repo
        if: steps.update.outputs.updated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add mscoreutils.nuspec tools/chocolateyinstall.ps1
          git commit -m "Automation: Updated manifest files tracking upstream changes"
          git push

